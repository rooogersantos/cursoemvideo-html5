<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>

<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Esta vídeo está hospedado no meu próprio servidor</p>
    <video width="640" poster="imagem/thumb.JPG" autoplay controls loop>
        <source src="midia/thicchino_ssstwitter.com.mp4" type="video/mp4">
        <source src="midia/thicchino_ssstwitter.com.mkv" type="video/mkv">
        <source src="midia/thicchino_tsstwitter.com.webm" type="video/webm">
        <source src="midia/thicchino_tsstwitter.com.ogv" type="video/ogv">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeo</p>
    </video>

    <h1>Inserindo vídeos do Youtube</h1>
    <iframe width="640" height="360" src="https://www.youtube.com/embed/jPWsBuiy1rE?si=rb1KkNlT6TwIc2tA"
    title="YouTube video player" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <p>Infelizmente essa buceta não dá certo, então fica aí goonando nos mamilos</p>
    <p>Ou desce, que ali embaixo eu consegui colocar um vídeo do Vimeo</p>

    <iframe title="vimeo-player" src="https://player.vimeo.com/video/185871317?h=a63f42bf1b" width="640" height="360" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" allowfullscreen></iframe>

</body>

</html>
