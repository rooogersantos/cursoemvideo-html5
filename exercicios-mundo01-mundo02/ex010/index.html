<!DOCTYPE html>

    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador
    </p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" sizes="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/01_The_Manifesto_of_Mayhem_Live_from_Copacabana_Rio_de_Janeiro.mp3" type="audio/mpeg">
        <source src="midia/01_The_Manifesto_of_Mayhem_Live_from_Copacabana_Rio_de_Janeiro.ogg" type="audio/ogg">
        <source src="midia/01_The_Manifesto_of_Mayhem_Live_from_Copacabana_Rio_de_Janeiro.wav" type="audio/wav">
    </audio> 
    <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/02_Bloody_Mary_Live_from_Copacabana_Rio_de_Janeiro.mp3"> Clique aqui para baixar o arquivo</a></p>
