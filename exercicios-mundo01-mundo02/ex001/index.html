<!-- Informa ao navegador que este documento está escrito na versão mais atual, o HTML5 -->
<!DOCTYPE html>

<!-- Tag principal que abre o documento HTML. O atributo lang="pt-br" avisa que o site está em Português do Brasil -->
<html lang="pt-br">

<!-- O 'head' (cabeça) guarda as configurações técnicas do site, que não aparecem diretamente na tela para o usuário -->
<head>
    <!-- Define a codificação de caracteres como UTF-8, garantindo que acentos e o 'ç' funcionem sem bugar -->
    <meta charset="UTF-8">
    <!-- Configura a responsividade, garantindo que o site se ajuste bem tanto em computadores quanto em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define o título da página, que é o texto que aparece lá na aba do navegador -->
    <title>Meu primeiro exercício</title>
<!-- Fecha a tag head -->
</head>

<!-- O 'body' (corpo) é onde fica tudo o que realmente aparece na tela para quem visita o site -->
<body>
    <!-- Cria o título principal da página. O 'h1' é o cabeçalho de maior importância (Heading 1) -->
    <h1>Olá, mundo!</h1>
    <!-- Cria uma linha horizontal na tela (Horizontal Rule), ótima para separar seções visualmente -->
    <hr>
    <!-- O 'p' cria um parágrafo de texto comum -->
    <p>Esse é o meu primeiro documento html. Legal né?</p>
    <!-- Mais um parágrafo de texto -->
    <p>Esta é um momento único. Estou criando um site!!!</p>
    <!-- Outra linha horizontal para fechar a estrutura do conteúdo -->
    <hr>
<!-- Fecha a tag body, encerrando a área de conteúdo visível -->   
</body>

<!-- Fecha a tag html, indicando o fim do documento -->
</html>
